                    ach:
                      type: object
                      description: 'ACH-specific information. Only present if the Transaction is an ACH. The optional `iat` object within `ach` contains details for International ACH Transactions. It is only included if `iat_ach_display_enabled` is set to `true` for the program and the transaction contains IAT data.

                        '
                      allOf:
                      - allOf:
                        - $ref: '#/paths/~1transfers/post/responses/201/content/application~1json/schema/allOf/0/allOf/3/properties/ach/allOf/0'
                        - type: object
                          properties:
                            ach_return_code:
                              type: string
                              description: ACH return code, pulled from the Return File
                            ach_return_reason:
                              type: string
                              description: ACH return reason, pulled from the Return File
                            addenda:
                              $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/addenda/allOf/0'
                            noc_code:
                              type: string
                              description: 'Notification of Change (NOC) code, returned from the RDFI (Receiving Depository Financial Institution).

                                '
                            noc_corrected_data:
                              type: string
                              description: 'Notification of Change (NOC) corrected data description, returned from the RDFI (Receiving Depository Financial Institution).

                                '
                            noc_reason:
                              type: string
                              description: 'Notification of Change (NOC) description, returned from the RDFI (Receiving Depository Financial Institution).

                                '
                            transfer_trace_id:
                              $ref: '#/paths/~1transfers/post/responses/201/content/application~1json/schema/allOf/1/properties/ach/allOf/0/allOf/1/properties/transfer_trace_id'
                            originator_routing_number:
                              type: string
                              description: 'Routing Number of individual or business originating the ACH transfer.

                                '
                              example: '123456789'
                            counterparty_name:
                              type: string
                              description: Counterparty name.
                            iat:
                              type: object
                              description: International ACH Transaction (IAT) details.
                              properties:
                                foreign_exchange_indicator:
                                  type: string
                                  description: 'Identifies if the currency of the transaction changes.

                                    The Newline API supports the following values:


                                    - `FF` - Fixed to Fixed

                                    - `FV` - Fixed to Variable

                                    '
                                  example: FF
                                foreign_exchange_reference_indicator:
                                  type: string
                                  description: 'Defines the type of value in the "foreign_exchange_reference" field.

                                    The Newline API supports the following values:


                                    - `"1"` - Foreign Exchange Rate

                                    - `"2"` - Foreign Exchange Reference Number

                                    - `"3"` - If Foreign Exchange Indicator is "FF"

                                    '
                                  example: '3'
                                foreign_exchange_reference:
                                  type: string
                                  description: If "foreign_exchange_indicator" is "FF" then this field blank;  otherwise it will contain either the foreign exchange rate used to execute the foreign exchange conversion  or another reference to the foreign exchange transaction.
                                iso_destination_country_code:
                                  type: string
                                  description: Country code of the destination country.
                                  example: US
                                iso_originating_currency_code:
                                  type: string
                                  description: Currency code for transaction origination currency.
                                  example: USD
                                iso_destination_currency_code:
                                  type: string
                                  description: Currency code for transaction destination currency.
                                  example: USD
                                transaction_code:
                                  type: string
                                  description: 'Transaction code describing a debit or credit and the account type used in the payment.

                                    Payment transaction code requirements differ based on the receiving country.

                                    '
                                  example: '22'
                                transaction_type_code:
                                  type: string
                                  description: 'Identifies the IAT Transaction Type Code.

                                    The Newline API supports the following values:


                                    - `"ANN"` (Annuity)

                                    - `"RLS"` (Rent/Lease)

                                    - `"POS"` (Point of Sale Entry)

                                    - `"BUS"` (Business/Commercial)

                                    - `"SAL"` (Salary/Payroll)

                                    - `"RCK"` (Re-presented Check Entry)

                                    - `"DEP"` (Deposit)

                                    - `"TAX"` (Tax)

                                    - `"SHR"` (Shared Network Transaction)

                                    - `"LOA"` (Loan)

                                    - `"TEL"` (Telephone-Initiated Entry)

                                    - `"MIS"` (Miscellaneous)

                                    - `"ARC"` (Accounts Receivable Entry)

                                    - `"WEB"` (Internet-Initiated Entry)

                                    - `"MOR"` (Mortgage)

                                    - `"BOC"` (Back Office Conversion Entry)

                                    - `"PEN"` (Pension)

                                    - `"MTE"` (Machine Transfer Entry)

                                    - `"REM"` (Remittance)

                                    - `"POP"` (Point of Purchase Entry)

                                    '
                                  example: MIS
                                foreign_payment_amount:
                                  type: string
                                  description: The value of the funds if the destination currency code is different from destination country code.
                                foreign_trace_number:
                                  type: string
                                  description: Optional trace number that can be supplied by the originator.
                                originator_street_address:
                                  type: string
                                  description: "The street address of the originator. On received IATs, \nthis is the originator's street address supplied with the received payment.\n"
                                  example: 410 TERRY AVENUE NORTH
                                originator_city_state_province:
                                  type: string
                                  description: "The city and, if applicable, the state or province of the Originator. \nAn asterisk (*) will separate the two values in this field.\n"
                                  example: SEATTLE*WA
                                originator_country_postal_code:
                                  type: string
                                  description: "The two-character alphabetic country code, as defined within the ISO 3166-1-alpha-2 code list, \nand the postal code of the Originator. An asterisk (*) will separate the two values in this field.\n"
                                  example: US*98109
                                odfi_name:
                                  type: string
                                  description: The name of the ODFI.
                                  example: BANK OF AMERICA NA
                                odfi_identification_number_qualifier:
                                  type: string
                                  description: 'A 2-digit code that identifies the type of ID in the "odfi_id" field.

                                    The Newline API supports the following values:


                                    - `"01"` - National Clearing System Number

                                    - `"02"` - BIC Code

                                    - `"03"` - IBAN

                                    '
                                  example: '01'
                                odfi_id:
                                  type: string
                                  description: The bank identification number of the DFI at which the Originator maintains their account.
                                  example: '121000358'
                                odfi_branch_country_code:
                                  type: string
                                  description: Country code of the ODFI.
                                  example: US
                                rdfi_name:
                                  type: string
                                  description: The name of the RDFI.
                                  example: FIFTH THIRD BANK NATIONAL ASSOCIA
                                rdfi_identification_number_qualifier:
                                  type: string
                                  description: 'A 2-digit code that identifies the type of ID in the "rdfi_id" field.

                                    The Newline API supports the following values:


                                    - `"01"` - National Clearing System Number

                                    - `"02"` - BIC Code

                                    - `"03"` - IBAN

                                    '
                                  example: '01'
                                rdfi_id:
                                  type: string
                                  description: The bank identification number of the DFI at which the Receiver maintains his account.
                                  example: 071919133
                                rdfi_branch_country_code:
                                  type: string
                                  description: Country code of the RDFI. Will always be US for domestic IAT transactions
                                  example: US
                                counterparty_street_address:
                                  type: string
                                  description: The street address of the Receiver.
                                  example: 228 S BURNS
                                counterparty_city_state_province:
                                  type: string
                                  description: "The city and, if applicable, the state or province of the Receiver. \nAn asterisk (*) will separate the two values in this field.\n"
                                  example: INDEPEDENCE*KS
                                counterparty_country_postal_code:
                                  type: string
                                  description: "The two-character alphabetic country code, as defined within the ISO 3166-1-alpha-2 code list, \nand the postal code of the Receiver. An asterisk (*) will separate the two values in this field.\n"
                                  example: US*67301
                                payment_related_information_1:
                                  type: string
                                  description: "The payment related information found in the remitance information addenda when provided. \nWhen the payment related information for an IAT Entry includes the identification of a country, \nthat country must be identified using that country's two-character alphabetic country code, \nas defined within the ISO 3166-1-alpha-2 code list.\n\nAn asterisk (\"*\") will be used as the delimiter between the data elements in the field.\n"
                                  example: NTE*ADD*FCS003348198932 PAYMENT-NUM  351380\NTE*ADD*601 POP GOODS AND SERVICES
                                payment_related_information_2:
                                  type: string
                                  description: "The payment related information found in the remitance information addenda when provided. \nWhen the payment related information for an IAT Entry includes the identification of a country, \nthat country must be identified using that country's two-character alphabetic country code, \nas defined within the ISO 3166-1-alpha-2 code list.\n\nAn asterisk (\"*\") will be used as the delimiter between the data elements in the field.\n"
                                foreign_correspondent_banks:
                                  type: array
                                  description: List of foreign correspondent banks involved in the IAT transaction.
                                  items:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                        description: The name of the Foreign Correspondent Bank when provided
                                        example: BANK OF AMERICA CANADA
                                      id_number_qualifier:
                                        type: string
                                        description: 'A 2-digit code that identifies the type of ID in the "id_number" field when provided.

                                          The Newline API supports the following values:


                                          - `"01"` - National Clearing System Number

                                          - `"02"` - BIC Code

                                          - `"03"` - IBAN

                                          '
                                        example: '01'
                                      id_number:
                                        type: string
                                        description: The bank identification number of the Foreign Correspondent Bank when provided
                                        example: '121000358'
                                      branch_country_code:
                                        type: string
                                        description: A two-character alphabetic country code to identify the country in which the branch of the Foreign Correspondent Bank is located when provided.
                                        example: CA
