  /transactions/{uid}:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    - $ref: '#/paths/~1pools~1%7Buid%7D/parameters/1'
    get:
      tags:
      - Transactions
      summary: Get a single Transaction
      description: Retrieves a single Transaction resource along with its details, including amount, origin, destination, and status.
      responses:
        '200':
          description: A single Transaction is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: '#/paths/~1transaction_events~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/0'
                  - type: object
                    properties:
                      id:
                        type: integer
                        description: 'An index, distinct from a Transaction''s uid, that indicates the order in which the Transactions were created.

                          '
                        example: 233
                      adjustment_uid:
                        type:
                        - string
                        - 'null'
                        description: The UID of the Adjustment this Transaction is associated with, if any.
                        example: rLS9K7uqqgdEqBu4
                      customer_uid:
                        type: string
                        description: The unique id of the Customer associated with the Transaction.
                        example: 6UYRjzgguXjjKDtK
                      created_at:
                        type: string
                        format: date-time
                        description: 'The date and time when the Transaction is first recognized by Newline. This may be when the Transfer is initiated if the Transaction is associated with one.

                          '
                        example: '2019-10-14T03:21:53.301Z'
                      custodial_account_uids:
                        type: array
                        description: 'A list of unique ids referring to Custodial Accounts that are currently involved in this Transaction. An empty array will be returned if there are no Custodial Accounts involved. The array may contain more values as the Transaction progresses and will no longer grow when its status becomes settled. The array may still be empty by the time the Transaction is settled if there is no custodial asset movement as a result of this Transaction.

                          '
                        items:
                          type: string
                          example:
                          - 66gso857LyQWC6XN
                          - Gw4gr1T81YrvLT6M
                      description:
                        type: string
                        description: Description provided to the Transaction during origination
                        example: Transfer from "Clothing Branding installation" to "deposit architect hack"
                      destination_synthetic_account_uid:
                        type: string
                        example: exMDShw6yM3NHLYV
                        description: Synthetic Account where the asset has landed
                      initial_action_at:
                        type: string
                        format: date-time
                        description: 'The date and time of some action (e.g. a debit authorization) that resulted in this Transaction''s creation. When relevant and available, this value is a timestamp received by and generated externally to Newline; otherwise, this value will be when a transaction request was received and virtually identical to `created_at`

                          '
                        example: '2019-10-14T03:21:53.301Z'
                      net_asset:
                        type: string
                        enum:
                        - positive
                        - negative
                        - neutral
                        example: positive
                        description: 'Indicates whether the Customer''s asset has gone up (`positive`), gone down (`negative`) or stayed the same (`neutral`) as a result of this Transaction.

                          '
                      return_uid:
                        type:
                        - string
                        - 'null'
                        description: 'The uid of a related Return, when applicable.

                          '
                        example: Fnf9cbheYhkTkais
                      settled_at:
                        type: string
                        format: date-time
                        description: The date and time when the Transaction is settled
                        example: '2019-10-17T00:01:53.682Z'
                      settled_index:
                        type:
                        - integer
                        - 'null'
                        description: 'Another unique index that indicates the order in which the Transactions were settled. Null if the Transaction''s status is queued or pending.

                          '
                        example: 23
                      source_synthetic_account_uid:
                        type: string
                        example: 4XkJnsfHsuqrxmeX
                        description: Synthetic Account from where the asset is pulled
                      statement_posted_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: The date and time when the statement was posted
                        example: '2019-10-17T00:01:53.682Z'
                      status:
                        type: string
                        enum:
                        - canceled
                        - queued
                        - pending
                        - settled
                        - failed
                        - denied
                        - expired
                        example: settled
                        description: 'When a Transfer is created via [POST /transfers](/reference/post_transfers), an associated Transaction is created with status `queued`. If it involves at least one custodial transfer, once the custodial transfer is initiated, the status will transition to `pending`.


                          Once a Transaction is settled, whether it has asset movement in custodial level, or is synthetic-only, or is RDFI (Receiving Depository Financial Institution, meaning no Newline Transfer was associated), it will have a `settled` status.

                          '
                      transaction_batch_uid:
                        type:
                        - string
                        - 'null'
                        example: '4'
                        description: The unique id of the Transaction Batch this Transaction is associated with, if any.
                      transaction_event_uids:
                        type: array
                        description: 'A list of unique ids referring to Transaction Events belonging to this Transaction. An empty array will be returned if there is no event involved. The array may contain more values as the Transaction progresses and will no longer grow when its status becomes settled. The array may still be empty at the time the Transaction is settled if there is no custodial asset movement as a result of this Transaction.

                          '
                        items:
                          type: string
                          example:
                          - MB2yqBrm3c4bUbou
                          - qCEEyGQw73Ajn3WZ
                      transfer_uid:
                        type:
                        - string
                        - 'null'
                        description: The unique id of the Transfer this Transaction is associated with, if any.
                        example: rLS9K7uqqgdEqBu4
                      type:
                        type: string
                        enum:
                        - ach
                        - ach_return
                        - atm_withdrawal
                        - book_transfer
                        - card_load
                        - card_purchase
                        - card_refund
                        - cash_load
                        - corporate_action
                        - credit
                        - denied_authorization
                        - dispute
                        - fee
                        - initiated_ach_return
                        - initiated_ach_reversal
                        - initiated_wire_return
                        - instant_payment
                        - interest
                        - other
                        - peer_to_peer_transfer
                        - reversal
                        - reversed_transfer
                        - set_account_balance
                        - wire
                        example: ach
                        description: 'Transactions are categorized by Type.  See the Transaction Statuses and Transaction Types section below for a list and definition of each Transaction Type that Newline supports.

                          '
                      us_dollar_amount:
