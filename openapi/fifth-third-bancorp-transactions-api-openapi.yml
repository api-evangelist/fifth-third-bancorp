  /transactions/{uid}/authorize:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    - $ref: '#/paths/~1pools~1%7Buid%7D/parameters/1'
    put:
      tags:
      - Transactions
      summary: Approve or deny a transaction
      description: Approves or denies a pending Transaction. This endpoint is used to explicitly authorize or reject a Transaction before it is executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                authorization_status:
                  type: string
                  description: 'The current status of the transaction authorization.

                    '
                  enum:
                  - client_approved
                  - client_denied
                  example: client_denied
                denied_memo:
                  type: string
                  maxLength: 44
                  description: 'Freeform text (up to 44 characters) that should be attached to the transaction if the transaction is to be denied. Optional.

                    '
                denied_reason:
                  type: string
                  description: 'The reason for the authorization denial. For wire transactions, must be one of (`vrn_archived`), (`vrn_locked`), (`international_payment`), (`unauthorized_credit`). For ACH transactions, must be one of (`vrn_archived`), (`vrn_locked`), (`debit_limit_exceeded`), (`unauthorized_credit`), (`unauthorized_debit`), (`insufficient_funds`)

                    '
                  enum:
                  - debit_limit_exceeded
                  - insufficient_funds
                  - international_payment
                  - unauthorized_credit
                  - unauthorized_debit
                  - vrn_archived
                  - vrn_locked
              required:
              - authorization_status
      responses:
        '200':
          description: The authorization resource is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    authorization:
                      type: object
                      description: 'Transaction Authorization information. Only present if authorization was required for a given transaction.

                        '
                      properties:
                        authorization_finalized_at:
                          type: string
                          format: date-time
                          description: 'The date and time when authorization for this transaction got finalized. It will only appear if authorization status is in one of the final statuses: `auto_approved`, `auto_denied`, `client_approved`, `client_denied`, `client_unanswered_auto_approved` or `client_unanswered_auto_denied`.

                            '
                          example: '2024-10-09T00:12:53.729Z'
                        authorization_required_by:
                          type: string
                          format: date-time
                          description: 'The date and time representing the deadline by which the authorization decision should be made by client. If no authorization is provided by this date, the transaction status will transition to client_unanswered_auto_approved.

                            '
                          example: '2024-10-10T00:18:53.729Z'
                        authorization_status:
                          type: string
                          enum:
                          - auto_approved
                          - auto_denied
                          - client_approval_pending
                          - client_approved
                          - client_denied
                          - client_unanswered_auto_approved
                          - client_unanswered_auto_denied
                          - created
                          description: 'A value indicating the current state of authorization for this transaction.

                            '
                          example: client_denied
                        denied_memo:
                          type: string
                          description: 'Freeform text (up to 44 characters) attached as a memo to authorization. It will only appear if authorization status is `auto_denied`, `client_denied` or `client_unanswered_auto_denied`.

                            '
                          example: denied memo
                        denied_reason:
                          type: string
                          description: 'A description of why the authorization was denied. It will only appear if authorization status is `auto_denied`, `client_denied` or `client_unanswered_auto_denied`.

                            '
                          example: debit_limit_exceeded
        '400':
          description: Bad authorization request
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1returns/get/responses/403/content/application~1json/schema'
              examples:
                transaction_authorization_status_error:
                  value:
                    errors:
                    - code: 6009
                      title: Transaction cannot be authorized
                      detail: Authorization status does not allow updates
                      occurred_at: '2023-10-04T13:23:04.345Z'
                    status: 400
                transaction_authorization_decision_window_expired:
                  value:
                    errors:
                    - code: 6010
                      title: Transaction cannot be authorized
                      detail: Transaction authorization window has passed
                      occurred_at: '2023-10-04T13:23:04.345Z'
                    status: 400
                transaction_ineligible_for_authorization:
                  value:
                    errors:
                    - code: 6011
                      title: Transaction cannot be authorized
                      detail: Transaction is not eligible for authorization
                      occurred_at: '2023-10-04T13:23:04.345Z'
                    status: 400
        '403':
          description: Client authorization disabled. (The Program is not configured for Client Authorization)
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1returns/get/responses/403/content/application~1json/schema'
              examples:
                default_routing_error:
                  value:
                    errors:
                    - code: 6012
                      title: Client authorization is not enabled
                      detail: This program is not configured for client authorization of transactions.
                    status: 403
        '422':
          description: An exception occurred while authorizing transaction
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1returns/get/responses/403/content/application~1json/schema'
              examples:
                transaction_authorization_error:
                  value:
                    errors:
                    - code: 6008
                      title: Transaction cannot be authorized
                      detail: An exception occurred while authorizing transaction
                      occurred_at: '2023-10-04T13:23:04.345Z'
                    status: 422
