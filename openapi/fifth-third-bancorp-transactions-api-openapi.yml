  /transaction_events/{uid}:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    - $ref: '#/paths/~1pools~1%7Buid%7D/parameters/1'
    get:
      tags:
      - Transactions
      summary: Get a single Transaction Event
      description: Retrieves a single Transaction Event resource, including its status, timestamps, and associated Transaction details.
      responses:
        '200':
          description: A single Transaction Event is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    uid:
                      type: string
                      description: Newline-generated unique id resource specific to the current endpoint
                      readOnly: true
                      example: EhrQZJNjCd79LLYq
                - type: object
                  properties:
                    settled_index:
                      type: integer
                      description: 'A unique index that indicates the order in which Transaction Events were settled

                        '
                      example: 9
                    transaction_uids:
                      type: array
                      description: 'A list of UIDS referring to Transactions this Transaction Event belongs to.

                        '
                      items:
                        type: string
                        example:
                        - SMwKC1osz77DTEiu
                        - m6FyXmEDgDfng4GZ
                    source_custodial_account_uid:
                      type: string
                      example: dmRtw1xkS9ghrntB
                      description: Custodial Account from which the asset is pulled
                    destination_custodial_account_uid:
                      type: string
                      example: W55zKgvAk3zkpGM3
                      description: Custodial Account where the asset lands
                    custodial_line_item_uids:
                      type: array
                      description: 'A list of UIDS referring to Custodial Line Items belonging to this event. There are always at least two line items if the status is `settled`.

                        '
                      items:
                        type: string
                        example:
                        - y4r8oTATb23MdGDF
                        - m9bED9iicUUk8YAc
                    status:
                      type: string
                      enum:
                      - settled
                      description: Transaction Events will always have a status of `settled`
                    us_dollar_amount:
                      type: string
                      example: '12.34'
                      description: The amount will never be negative
                    type:
                      type: string
                      enum:
                      - odfi_ach_deposit
                      - odfi_ach_withdrawal
                      - rdfi_ach_deposit
                      - rdfi_ach_withdrawal
                      example: odfi_ach_deposit
                    debit_card_uid:
                      type: string
                      example: oPeppbFTE9FvYKq5
                      description: 'If this Transaction Event represents a Debit Card purchase or refund, the UID of the Debit Card used for the purchase/refund. Otherwise not provided.

                        '
                    net_asset:
                      type: string
                      enum:
                      - positive
                      - negative
                      - neutral
                      example: positive
                      description: 'Indicates whether the Customer''s asset has gone up (`positive`), gone down (`negative`) or stayed the same (`neutral`) as a result of this Transaction Event. This value is determined by `type`.

                        '
                    description:
                      type: string
                      example: Transfer from Bank ABC 123 to Newline 999
                    created_at:
                      type: string
                      format: date-time
                      description: 'The date and time when the event is first recognized by Newline. This may be when the Transfer is initiated if the event is associated with one.

                        '
                      example: '2019-10-15T15:53:13.591Z'
                    settled_at:
                      type: string
                      format: date-time
                      description: The date and time when the event is settled
                      example: '2019-10-16T12:51:12.673Z'
              examples:
                transactionEvent:
                  value:
                    uid: MB2yqBrm3c4bUbou
                    settled_index: 1
                    transaction_uids:
                    - SMwKC1osz77DTEiu
                    - Wfp6uBnhKDxUtCeu
