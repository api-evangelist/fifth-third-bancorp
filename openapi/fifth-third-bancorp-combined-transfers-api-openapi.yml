                      usd_transfer_amount: '1.23'
                      wire:
                        intermediary_bank_name: Big Bank Inc
                        intermediary_bank_address:
                          line1: 123 Main St
                          line2: Brooklyn NY
                          country: US
                        intermediary_bank_routing_number: '123456789'
                        wire_transmitter:
                          name: Bunker LLC
                          line1: 456 Second St
                          line2: Queens NY
                          country: US
                          transmitter_identifier: '1234567890'
                      uid: null
                    uid: iLCATodsXhKPpPRv
                failed:
                  value:
                    created_at: '2025-03-27T09:23:07.890Z'
                    status: failed
                    errors:
                    - code: 33005
                      title: Could not continue Combined Transfer
                      detail: An exception occurred while continuing a Combined Transfer
                      occurred_at: '2025-03-27T09:23:07.890Z'
                    external_uid: null
                    synthetic_account:
                      external_uid: abcd12345
                      name: Spinach Fund
