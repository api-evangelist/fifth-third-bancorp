openapi: 3.2.0
info:
  title: Newline Platform Synthetic Accounts API
  version: 1.0.0
  description: Welcome!
servers:
- url: https://sandbox.newline53.com/api/v1
security:
- ApiKeyAuth: []
tags:
- name: Synthetic Accounts
  description: Synthetic Accounts serve as the foundation for asset tracking in Newline.
paths:
  /synthetic_account_types:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    get:
      tags:
      - Synthetic Accounts
      summary: List Synthetic Account Types
      description: Retrieve a list of Synthetic Account Types available for use in your Program. These types define the behavior and characteristics of Synthetic Accounts.
      parameters:
      - name: program_uid
        in: query
        schema:
          type: string
          example: EhrQZJNjCd79LLYq
        description: Only list Synthetic Account Types that are available to be used by the given Program
      - $ref: '#/paths/~1pools/get/parameters/1'
      - $ref: '#/paths/~1pools/get/parameters/2'
      responses:
        '200':
          description: A list of Synthetic Account Types is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1pools/get/responses/200/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/paths/~1synthetic_account_types~1%7Buid%7D/get/responses/200/content/application~1json/schema'
              examples:
                synthetic_account_types_list:
                  value:
                    total_count: 10
                    count: 4
                    limit: 4
                    offset: 0
                    data:
                    - description: This Synthetic Account Type will be used to open Synthetic Accounts that will only contain a USD asset type.
                      name: General for My Program
                      program_uid: Sw9DjTGJq5L1ctZN
                      synthetic_account_category: general
                      uid: fRMwt6H14ovFUz1s
                    - description: This Synthetic Account Type will be used to create an external Synthetic Account used for ACH transfers. The external Synthetic Account will be associated with the customer's externally connected financial institution.
                      name: ACH External Account for My Program
                      program_uid: Sw9DjTGJq5L1ctZN
                      synthetic_account_category: ach_external
                      uid: q4mdMxMtjXfdbrjn
                    - description: This Synthetic Account Type will be used to create an external Synthetic Account used for wire transfers. The external Synthetic Account will be associated with the customer's externally connected financial institution.
                      name: Wire External Account for My Program
                      program_uid: Sw9DjTGJq5L1ctZN
                      synthetic_account_category: wire_external
                      uid: LTpFu4XV56kim8vR
                    - description: This Synthetic Account Type will be used to create an external Synthetic Account used for instant payments. The external Synthetic Account will be associated with the customer's externally connected financial institution.
                      name: Instant Payments External Account for My Program
                      program_uid: Sw9DjTGJq5L1ctZN
                      synthetic_account_category: instant_payment_external
                      uid: gh6APuePFP2j9iFR
      operationId: getSyntheticAccountTypes
      x-operation-id-source: derived
  /synthetic_account_types/{uid}:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    - $ref: '#/paths/~1pools~1%7Buid%7D/parameters/1'
    get:
      tags:
      - Synthetic Accounts
      summary: Get a Single Synthetic Account Type
      description: 'Returns a single Synthetic Account Type resource along with supporting details.


        Enables changes to the Synthetic Account fields, including the Master Synthetic Account. The Master Synthetic Account remains identifiable by the `master_account` flag stored with the Synthetic Account record.'
      responses:
        '200':
          description: A single Synthetic Account Type is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1pools~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    description:
                      type: string
                      description: A description outlining the intended use and requirements for this program's instance of the synthetic_account_type
                      readOnly: true
                      example: This synthetic_account_type will be used to open synthetic_accounts for our customers that will only contain a USD asset type.
                    program_uid:
                      type: string
                      description: A UID referring to the Program this synthetic_account_type belongs to
                      readOnly: true
                      example: kaxHFJnWvJxRJZxq
                    synthetic_account_category:
                      type: string
                      description: The name of the Synthetic Account Category for this type. Accounts can be in one of several categories that indicate their handling properties and defining characteristics such as 'general' or 'external'. As an example, 'external' accounts do not actually hold any assets and are instead used to represent an account at an external institution for use in initiating transfers.
                      readOnly: true
                      enum:
                      - general
                      - ach_external
                      - instant_payment_external
                      - wire_external
      operationId: getSyntheticAccountTypesByUid
      x-operation-id-source: derived
  /synthetic_accounts:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    get:
      tags:
      - Synthetic Accounts
      summary: List Synthetic Accounts
      description: Retrieve a list of Synthetic Accounts associated with the specified Customer and Pool. This endpoint supports filtering by account type, category, status, and sorting by balance or name.
      parameters:
      - $ref: '#/paths/~1pools/get/parameters/0'
      - $ref: '#/paths/~1transfers/get/parameters/1'
      - $ref: '#/paths/~1transfers/get/parameters/2'
      - $ref: '#/paths/~1pools/get/parameters/1'
      - $ref: '#/paths/~1pools/get/parameters/2'
      - name: synthetic_account_type_uid
        in: query
        schema:
          type: string
          example: q4mdMxMtjXfdbrjn
        description: Filter by Synthetic Account Type
      - name: synthetic_account_category
        in: query
        schema:
          type: string
          enum:
          - general
          - ach_external
          - wire_external
          - instant_payment_external
        description: Filter by Synthetic Account Category
      - $ref: '#/paths/~1custodial_accounts/get/parameters/4'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - initiated
          - active
          - archived
          - failed
          example: active
          description: 'Filter by status. Multiple values are allowed, e.g. `status[]=archived&status[]=failed`.

            '
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name_asc
          - name_desc
          - net_usd_balance_asc
          - net_usd_balance_desc
          - net_usd_pending_balance_asc
          - net_usd_pending_balance_desc
          - net_usd_available_balance_asc
          - net_usd_available_balance_desc
      responses:
        '200':
          description: A list of Synthetic Accounts is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1pools/get/responses/200/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        allOf:
                        - $ref: '#/paths/~1synthetic_accounts/post/requestBody/content/application~1json/schema/allOf/0/allOf/0'
                        - $ref: '#/paths/~1synthetic_accounts/post/requestBody/content/application~1json/schema/allOf/0/allOf/1'
                        - type: object
                          properties:
                            ach:
                              type:
                              - object
                              - 'null'
                              description: 'Contains ACH-specific information. Only populated if the Synthetic Account is in the `ach_external` category.

                                '
                              allOf:
                              - $ref: '#/paths/~1synthetic_accounts/post/requestBody/content/application~1json/schema/allOf/1/properties/ach/allOf/0'
                            instant_payment:
                              type:
                              - object
                              - 'null'
                              description: 'Contains Instant Payment-specific information. Only populated if the Synthetic Account is in the `instant_payment_external` category.

                                '
                              allOf:
                              - type: object
                                properties:
                                  counterparty_name:
                                    description: 'Name of the business or individual who owns the counterparty Account.

                                      '
                                    allOf:
                                    - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_name/allOf/0'
                                  email:
                                    description: Email address of the counterparty
                                    type:
                                    - string
                                    - 'null'
                                    example: payments@veryexcellentbusiness.com
                                  phone:
                                    $ref: '#/paths/~1customers~1%7Buid%7D/put/requestBody/content/application~1json/schema/properties/details/allOf/0/allOf/0/allOf/1/properties/phone'
                            wire:
                              type:
                              - object
                              - 'null'
                              description: 'Contains wire-specific information. Only populated if the Synthetic Account is in the `wire_external` category.

                                '
                              allOf:
                              - type: object
                                properties:
                                  counterparty_name:
                                    description: 'Name of the business or individual who owns the counterparty Account.

                                      '
                                    allOf:
                                    - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_name/allOf/0'
                                  counterparty_bank_address:
                                    description: 'Address of the financial institution where the external account is held.

                                      '
                                    type:
                                    - object
                                    - 'null'
                                    allOf:
                                    - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_address/oneOf/0'
                                  counterparty_bank_name:
                                    description: 'Name of the financial institution where the counterparty account is held.

                                      '
                                    type:
                                    - string
                                    - 'null'
                                    allOf:
                                    - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_bank_name/allOf/0'
              examples:
                synthetic_accounts_list:
                  value:
                    total_count: 10
                    count: 4
                    limit: 4
                    offset: 0
                    data:
                    - uid: 4XkJnsfHsuqrxmeX
                      external_uid: ea8e1ccd-5893-4fcb-b09a-2b784ba7c73c
                      name: Primary Account
                      pool_uid: wTSMX1GubP21ev2h
                      synthetic_account_type_uid: fRMwt6H14ovFUz1s
                      synthetic_account_category: general
                      status: active
                      liability: true
                      net_usd_balance: '1567.13'
                      net_usd_pending_balance: '261.83'
                      net_usd_available_balance: '1409.88'
                      asset_balances:
                      - asset_quantity: '1567.13'
                        asset_type: USD
                        current_usd_value: '1567.13'
                        custodial_account_uid: DXr716uLzBm44HyP
                        custodial_account_name: First Checking
                        debit: false
                      master_account: true
                      custodial_account_uids:
                      - DXr716uLzBm44HyP
                      - 3fRiyDdbSVv9nKW2
                      account_number_last_four: '5372'
                      routing_number: '123456789'
                      opened_at: '2018-05-26T23:14:27.012Z'
                      closed_at: null
                      instant_payment: null
                      wire: null
                    - uid: exMDShw6yM3NHLYV
                      external_uid: 60689018-94e9-4870-970a-cc22f52c9c65
                      name: Wire Account
                      pool_uid: wTSMX1GubP21ev2h
                      synthetic_account_type_uid: VMwzNGctNAbSmHXJ
                      synthetic_account_category: wire_external
                      status: active
                      liability: false
                      net_usd_balance: null
                      net_usd_pending_balance: null
                      net_usd_available_balance: null
                      asset_balances: null
                      master_account: false
                      custodial_account_uids:
                      - NPeYkNMDVBWnKVXJ
                      account_number_last_four: '5372'
                      routing_number: '123456789'
                      opened_at: '2018-03-08T19:07:18.049Z'
                      closed_at: null
                      instant_payment: null
                      wire:
                        counterparty_name: Aunt Sandy
                        counterparty_bank_address:
                          line1: 334 Swamp St
                          line2: Bagdad, FL 32530
                          line3: null
                          country: US
                        counterparty_bank_name: First Beach Bank
                    - uid: nbDrqhrFAjqUdxBG
                      external_uid: f03fd9ff-a0a1-4e3c-981f-4d845836a2ce
                      name: Instant Payments Account
                      pool_uid: wTSMX1GubP21ev2h
                      synthetic_account_type_uid: fRMwt6H14ovFUz1s
                      synthetic_account_category: instant_payment_external
                      status: active
                      liability: false
                      net_usd_balance: null
                      net_usd_pending_balance: null
                      net_usd_available_balance: null
                      asset_balances: null
                      master_account: false
                      custodial_account_uids:
                      - DcMfBTHj94dsi471
                      account_number_last_four: '5372'
                      routing_number: '123456789'
                      opened_at: '2022-02-22T23:14:27.012Z'
                      closed_at: null
                      instant_payment:
                        counterparty_name: Paloma's Premium Polymers
                        email: paloma@premiumpolymers.co
                        phone: '5555551212'
                      wire: null
                    - uid: uu2XSYPAB57iX5wi
                      external_uid: g13fd9ff-a0a1-4a3c-782f-1b8458f6a2ce
                      name: ACH Account
                      pool_uid: wTSMX1GubP21ev2h
                      synthetic_account_type_uid: 9gdN9noL2L1nj9R8
                      synthetic_account_category: ach_external
                      status: active
                      liability: false
                      net_usd_balance: null
                      net_usd_pending_balance: null
                      net_usd_available_balance: null
                      asset_balances: null
                      master_account: false
                      custodial_account_uids:
                      - zH9WRBskMKiyu3D9
                      account_number_last_four: '7890'
                      routing_number: '123456789'
                      opened_at: '2021-05-12T23:14:27.012Z'
                      closed_at: null
                      ach:
                        counterparty_name: Arnold Arnoldson
                        account_type: checking
      operationId: getSyntheticAccounts
      x-operation-id-source: derived
    post:
      tags:
      - Synthetic Accounts
      summary: Create a New Synthetic Account
      description: 'Create a new Synthetic Account in the Pool with the provided specification.


        External Synthetic Accounts are counterparty records that represent accounts at external financial institutions. They contain all the necessary information to execute a payment. For specifics about each payment rail''s requirements, refer to our Payment Rails guides.'
      requestBody:
        required: true
        description: 'See [GET /synthetic_account_types](/reference/get_synthetic-account-types) for the list of available types

          '
        content:
          application/json:
            schema:
              allOf:
              - allOf:
                - allOf:
                  - $ref: '#/paths/~1transaction_events~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/0'
                  - $ref: '#/paths/~1transfers/post/requestBody/content/application~1json/schema/allOf/0/allOf/1'
                  - $ref: '#/paths/~1pools~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/0/allOf/1'
                - type: object
                  properties:
                    pool_uid:
                      type: string
                      description: The unique id of the Synthetic Account's pool
                      example: kaxHFJnWvJxRJZxq
                    synthetic_account_type_uid:
                      type: string
                      description: 'A unique id referring to the Synthetic Account''s type.

                        '
                      example: fRMwt6H14ovFUz1s
                    custodial_account_uids:
                      type: array
                      description: 'Array of unique ids of the Custodial Accounts this Synthetic Account is associated with.

                        '
                      items:
                        type: string
                      readOnly: true
                    synthetic_account_category:
                      type: string
                      description: The name of the Synthetic Account Category associated with the Synthetic Account Type for this account. Refer to the Synthetic Account Type for details.
                      readOnly: true
                      enum:
                      - general
                      - ach_external
                      - instant_payment_external
                      - wire_external
                    status:
                      type: string
                      description: 'A value indicating the overall state of this Synthetic Account.

                        '
                      enum:
                      - initiated
                      - active
                      - archived
                      - failed
                      example: active
                      readOnly: true
                    liability:
                      type: boolean
                      description: Liability or asset. Any Synthetic Account created via [POST /synthetic_accounts](/reference/post_synthetic-accounts) is a liability account, except for external accounts. Some asset Synthetic Accounts are automatically created by Newline during Customer onboarding for accounting purposes.
                      readOnly: true
                    net_usd_balance:
                      type:
                      - string
                      - 'null'
                      description: The current settled balance of this account in US Dollars. This field will be null for synthetic_account_types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '12.34'
                    net_usd_pending_balance:
                      type:
                      - string
                      - 'null'
                      description: The sum of all pending transactions for this account in US Dollars. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '-2.56'
                    net_usd_available_balance:
                      type:
                      - string
                      - 'null'
                      description: The balance available to spend calculated as the settled balance less any pending withdrawals. Pending deposits are not included. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '9.78'
                    net_usd_closing_balance:
                      type:
                      - string
                      - 'null'
                      description: The settled balance for the account in US Dollars as of the date in net_usd_closing_balance_as_of. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '9.87'
                    net_usd_closing_balance_as_of:
                      type: string
                      description: The date that net_usd_closing_balance was last calculated. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '2025-08-19'
                    asset_balances:
                      type: array
                      description: 'A list of balances for the various asset types held in Custodial Accounts associated with this Synthetic Account.

                        '
                      items:
                        type:
                        - object
                        - 'null'
                        properties:
                          asset_quantity:
                            type: string
                            example: 12.23
                          asset_type:
                            type: string
                            example: USD
                          current_usd_value:
                            type: string
                            example: 122.12
                          custodial_account_uid:
                            type: string
                            example: wZgfnLrLJcCAscnH
                          custodial_account_name:
                            type: string
                            example: First Checking
                          debit:
                            type: boolean
                            example: true
                      readOnly: true
                    master_account:
                      type: boolean
                      description: 'Used to identify the Master Synthetic Accounts that exist for every Program Customer. Master Synthetic Accounts are the default accounts where any unknown custodial transactions will settle and cannot be archived while a Program Customer is still active.

                        '
                      readOnly: true
                      example: true
                    routing_number:
                      description: The ABA routing number (if any) associated with this account. Some Synthetic Account Types require this field to be submitted along with the POST request. For example, any Synthetic Account Type from the `ach_external` or the `wire_external` category will require a `routing_number`. Submitting a `routing_number` with a Synthetic Account Type that does not require one will result in the routing number being ignored.
                      type:
                      - string
                      - 'null'
                      allOf:
                      - $ref: '#/paths/~1virtual_reference_numbers/post/requestBody/content/application~1json/schema/properties/routing_number/allOf/0'
                    account_number_last_four:
                      type:
                      - string
                      - 'null'
                      description: Last 4 digits of the Synthetic Account number
                      readOnly: true
                      example: '9012'
                    opened_at:
                      type: string
                      description: The DateTime at which this account was created
                      format: date-time
                      readOnly: true
                      example: '2019-01-31T17:32:28Z'
                    closed_at:
                      type:
                      - string
                      - 'null'
                      description: 'The DateTime at which this account was closed. This value will be present if the status is `archived` or `failed`.

                        '
                      format: date-time
                      readOnly: true
                      example: '2019-10-19T08:15:13Z'
                - type: object
                  properties:
                    account_number:
                      description: The account number (if any) associated with this account. Some Synthetic Account Types require this field to be submitted along with the POST request. For example, any Synthetic Account Type from the `ach_external` or the `wire_external` category will require an `account_number`. Submitting an `account_number` with a Synthetic Account Type that does not require one will result in the account number being ignored.
                      type:
                      - string
                      - 'null'
                      allOf:
                      - $ref: '#/paths/~1custodial_accounts~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/2/properties/account_number/allOf/0'
              - type: object
                properties:
                  external_processor_token:
                    type:
                    - string
                    - 'null'
                    description: The processor token required to create certain Synthetic Account Types.
                    example: processor-sandbox-96d86f35-ef58-4e4a-826f-4870b5d677f2
                  ach:
                    type: object
                    description: 'Contains ACH-specific information. Only populated if the Synthetic Account is in the `ach_external` category.

                      '
                    allOf:
                    - type: object
                      properties:
                        account_type:
                          description: The type of ACH account
                          type: string
                          enum:
                          - checking
                          - savings
                          example: checking
                        counterparty_name:
                          description: 'Name of the business or individual who owns the external account. Conditional maximum character length: for all newline supported SEC codes other than CIE, the counterparty_name can be 22 characters. For CIE SEC codes, the counterparty_name can be up to 15 characters.

                            '
                          maxLength: 22
                          type: string
                          example: Thelma's Flooring LLC
                    required:
                    - account_type
                    - counterparty_name
                  instant_payment:
                    description: 'Contains Instant Payment-specific information. Only populated if the Synthetic Account is in the `instant_payment_external` category.

                      '
                    allOf:
                    - $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/schema/allOf/1/properties/instant_payment'
                    required:
                    - counterparty_address
                    - counterparty_name
                  wire:
                    type: object
                    description: 'Contains wire-specific information. Only populated if the Synthetic Account is in the `wire_external` category.

                      '
                    allOf:
                    - allOf:
                      - type: object
                        properties:
                          counterparty_address:
                            type:
                            - object
                            - 'null'
                            description: 'Address of the business or individual who owns the external account.

                              '
                            allOf:
                            - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_address/oneOf/0'
                            example:
                              line1: 234 Xyz Rd
                              line2: APT 5
                              line3: Boston, MA 02110
                              country: US
                          counterparty_name:
                            description: 'Name of the business or individual who owns the counterparty Account. Required for synthetic accounts in the wire_external category. Maximum 35 characters.

                              '
                            allOf:
                            - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_name/allOf/0'
                          counterparty_bank_address:
                            type:
                            - object
                            - 'null'
                            description: 'Address of the financial institution where the external account is held.

                              '
                            allOf:
                            - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_address/oneOf/0'
                          counterparty_bank_name:
                            type:
                            - string
                            - 'null'
                            description: 'Name of the financial institution where the counterparty account is held.

                              '
                            allOf:
                            - $ref: '#/paths/~1sandbox~1mock_transactions/post/requestBody/content/application~1json/schema/allOf/0/properties/counterparty_bank_name/allOf/0'
                    required:
                    - counterparty_name
              required:
              - external_uid
              - name
              - pool_uid
              - synthetic_account_type_uid
            examples:
              new_synthetic_account:
                value:
                  name: Spinach Fund
                  pool_uid: wTSMX1GubP21ev2h
                  synthetic_account_type_uid: fRMwt6H14ovFUz1s
      responses:
        '201':
          description: A new Synthetic Account is created
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1synthetic_accounts/post/requestBody/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    ach:
                      type: object
                      description: 'Contains ACH-specific information. Only populated if the Synthetic Account is in the `ach_external` category.

                        '
                      allOf:
