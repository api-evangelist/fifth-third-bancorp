    post:
      tags:
      - Synthetic Accounts
      summary: Create a New Synthetic Account
      description: 'Create a new Synthetic Account in the Pool with the provided specification.


        External Synthetic Accounts are counterparty records that represent accounts at external financial institutions. They contain all the necessary information to execute a payment. For specifics about each payment rail''s requirements, refer to our [Payment Rails](https://developers.newline53.com/docs/payment-rails) guides.'
      requestBody:
        required: true
        description: 'See [GET /synthetic_account_types](/reference/get_synthetic-account-types) for the list of available types

          '
        content:
          application/json:
            schema:
              allOf:
              - allOf:
                - allOf:
                  - $ref: '#/paths/~1transaction_events~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/0'
                  - $ref: '#/paths/~1transfers/post/requestBody/content/application~1json/schema/allOf/0/allOf/1'
                  - $ref: '#/paths/~1pools~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/0/allOf/1'
                - type: object
                  properties:
                    pool_uid:
                      type: string
                      description: The unique id of the Synthetic Account's pool
                      example: kaxHFJnWvJxRJZxq
                    synthetic_account_type_uid:
                      type: string
                      description: 'A unique id referring to the Synthetic Account''s type.

                        '
                      example: fRMwt6H14ovFUz1s
                    custodial_account_uids:
                      type: array
                      description: 'Array of unique ids of the Custodial Accounts this Synthetic Account is associated with.

                        '
                      items:
                        type: string
                      readOnly: true
                    synthetic_account_category:
                      type: string
                      description: The name of the Synthetic Account Category associated with the Synthetic Account Type for this account. Refer to the Synthetic Account Type for details.
                      readOnly: true
                      enum:
                      - general
                      - ach_external
                      - instant_payment_external
                      - wire_external
                    status:
                      type: string
                      description: 'A value indicating the overall state of this Synthetic Account.

                        '
                      enum:
                      - initiated
                      - active
                      - archived
                      - failed
                      example: active
                      readOnly: true
                    liability:
                      type: boolean
                      description: Liability or asset. Any Synthetic Account created via [POST /synthetic_accounts](/reference/post_synthetic-accounts) is a liability account, except for external accounts. Some asset Synthetic Accounts are automatically created by Newline during Customer onboarding for accounting purposes.
                      readOnly: true
                    net_usd_balance:
                      type:
                      - string
                      - 'null'
                      description: The current settled balance of this account in US Dollars. This field will be null for synthetic_account_types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '12.34'
                    net_usd_pending_balance:
                      type:
                      - string
                      - 'null'
                      description: The sum of all pending transactions for this account in US Dollars. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '-2.56'
                    net_usd_available_balance:
                      type:
                      - string
                      - 'null'
                      description: The balance available to spend calculated as the settled balance less any pending withdrawals. Pending deposits are not included. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '9.78'
                    net_usd_closing_balance:
                      type:
                      - string
                      - 'null'
                      description: The settled balance for the account in US Dollars as of the date in net_usd_closing_balance_as_of. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '9.87'
                    net_usd_closing_balance_as_of:
                      type: string
                      description: The date that net_usd_closing_balance was last calculated. This field will be null for Synthetic Account Types in an external category (`ach_external`, `instant_payment_external`, `wire_external`).
                      readOnly: true
                      example: '2025-08-19'
                    asset_balances:
                      type: array
                      description: 'A list of balances for the various asset types held in Custodial Accounts associated with this Synthetic Account.

                        '
                      items:
                        type:
                        - object
                        - 'null'
                        properties:
                          asset_quantity:
                            type: string
                            example: 12.23
                          asset_type:
                            type: string
                            example: USD
                          current_usd_value:
                            type: string
                            example: 122.12
                          custodial_account_uid:
                            type: string
                            example: wZgfnLrLJcCAscnH
                          custodial_account_name:
                            type: string
                            example: First Checking
                          debit:
                            type: boolean
                            example: true
                      readOnly: true
                    master_account:
                      type: boolean
                      description: 'Used to identify the Master Synthetic Accounts that exist for every Program Customer. Master Synthetic Accounts are the default accounts where any unknown custodial transactions will settle and cannot be archived while a Program Customer is still active.

                        '
                      readOnly: true
                      example: true
                    routing_number:
                      description: The ABA routing number (if any) associated with this account. Some Synthetic Account Types require this field to be submitted along with the POST request. For example, any Synthetic Account Type from the `ach_external` or the `wire_external` category will require a `routing_number`. Submitting a `routing_number` with a Synthetic Account Type that does not require one will result in the routing number being ignored.
                      type:
                      - string
                      - 'null'
                      allOf:
                      - $ref: '#/paths/~1virtual_reference_numbers/post/requestBody/content/application~1json/schema/properties/routing_number/allOf/0'
                    account_number_last_four:
                      type:
                      - string
                      - 'null'
                      description: Last 4 digits of the Synthetic Account number
                      readOnly: true
                      example: '9012'
                    opened_at:
                      type: string
                      description: The DateTime at which this account was created
                      format: date-time
                      readOnly: true
                      example: '2019-01-31T17:32:28Z'
                    closed_at:
                      type:
                      - string
                      - 'null'
                      description: 'The DateTime at which this account was closed. This value will be present if the status is `archived` or `failed`.

                        '
                      format: date-time
                      readOnly: true
                      example: '2019-10-19T08:15:13Z'
                - type: object
                  properties:
                    account_number:
                      description: The account number (if any) associated with this account. Some Synthetic Account Types require this field to be submitted along with the POST request. For example, any Synthetic Account Type from the `ach_external` or the `wire_external` category will require an `account_number`. Submitting an `account_number` with a Synthetic Account Type that does not require one will result in the account number being ignored.
                      type:
                      - string
                      - 'null'
                      allOf:
                      - $ref: '#/paths/~1custodial_accounts~1%7Buid%7D/get/responses/200/content/application~1json/schema/allOf/2/properties/account_number/allOf/0'
              - type: object
                properties:
                  external_processor_token:
                    type:
