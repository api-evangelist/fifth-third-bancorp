  /synthetic_accounts/{uid}:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    - $ref: '#/paths/~1pools~1%7Buid%7D/parameters/1'
    get:
      tags:
      - Synthetic Accounts
      summary: Get a single Synthetic Account
      description: 'Returns a single Synthetic Account resource along with supporting details and account balances.


        Note: Newline will suppress the `account_number` value for Synthetic Accounts in the `ach_external`, `wire_external`, and `instant_payment_external` categories. The `account_number_last_four` value will be returned in the response to help identify these Synthetic Accounts.'
      responses:
        '200':
          description: A single Synthetic Account is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/schema'
              examples:
                general_synthetic_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/general_synthetic_account'
                instant_payment_synthetic_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/instant_payment_synthetic_account'
                wire_synthetic_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/wire_synthetic_account'
                ach_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/ach_account'
      operationId: getSyntheticAccountsByUid
      x-operation-id-source: derived
    put:
      tags:
      - Synthetic Accounts
      summary: Update the Synthetic Account metadata
      description: Enables changes to the Synthetic Account fields, including the Master Synthetic Account. The Master Synthetic Account remains identifiable by the `master_account` flag stored with the Synthetic Account record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/paths/~1synthetic_accounts/post/requestBody/content/application~1json/schema/allOf/0'
              - type: object
                properties:
                  note:
                    type: string
                    description: 'A reason for the Synthetic Account metadata change

                      '
                  ach:
                    type: object
                    description: 'Contains ACH-specific information. Only populated if the Synthetic Account is in the `ach_external` category.

                      '
                    allOf:
                    - $ref: '#/paths/~1synthetic_accounts/post/requestBody/content/application~1json/schema/allOf/1/properties/ach/allOf/0'
                  instant_payment:
                    type: object
                    description: 'Contains Instant Payment-specific information. Only populated if the Synthetic Account is in the `instant_payment_external` category.

                      '
                    allOf:
                    - $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/schema/allOf/1/properties/instant_payment'
                  wire:
                    type: object
                    description: 'Contains wire-specific information. Only populated if the Synthetic Account is in the `wire_external` category.

                      '
                    allOf:
                    - $ref: '#/paths/~1synthetic_accounts/post/requestBody/content/application~1json/schema/allOf/1/properties/wire/allOf/0'
      responses:
        '200':
          description: The updated Synthetic Account resource is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/schema'
              examples:
                general_synthetic_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/general_synthetic_account'
                instant_payment_synthetic_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/instant_payment_synthetic_account'
                wire_synthetic_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/wire_synthetic_account'
                ach_account:
                  $ref: '#/paths/~1synthetic_accounts/post/responses/201/content/application~1json/examples/ach_account'
        '400':
          description: 'A Synthetic Account is not updated if a required parameter is missing

            '
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1returns/get/responses/403/content/application~1json/schema'
              examples:
                missing_param_error:
                  value:
                    errors:
                    - code: 1003
                      title: Missing Request Parameter
                      detail: At least one parameter is missing. Cannot continue with the request
                      extra: name cannot be null or blank
                      occurred_at: '2018-03-08T19:07:18.049Z'
                    status: 400
      operationId: putSyntheticAccountsByUid
      x-operation-id-source: derived
    delete:
      tags:
      - Synthetic Accounts
      summary: Archive a Synthetic Account
      description: 'In order to archive a Synthetic Account, the account must:


        - not be a Master Synthetic Account i.e. `master_account` must be false.

        - have zero balance.

        - have no pending Transfers.


        Master Synthetic Accounts are archived when the Program Customer is archived (DELETE /customers/:uid).'
      responses:
        '204':
          description: Synthetic Account is archived successfully
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
        '422':
          description: 'A Synthetic Account is not archived

            '
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1returns/get/responses/403/content/application~1json/schema'
              examples:
                outstanding_balance_error:
                  value:
                    errors:
                    - code: 2004
                      title: Cannot archive Synthetic Account with balance
                      detail: A Synthetic Account with a non-zero balance cannot be archived
                      extra: Its balance is not 0
                      occurred_at: '2018-03-08T19:07:18.049Z'
                    status: 422
                pending_transfer_error:
                  value:
                    errors:
                    - code: 2005
                      title: Cannot archive Synthetic Account with pending Transfer
                      detail: A Synthetic Account with a pending Transfer cannot be archived
                      extra: It has a pending transfer
                      occurred_at: '2018-03-08T19:07:18.049Z'
                    status: 422
      operationId: deleteSyntheticAccountsByUid
      x-operation-id-source: derived
