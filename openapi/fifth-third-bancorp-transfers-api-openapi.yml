  /transfers/{uid}/cancel:
    parameters:
    - $ref: '#/paths/~1auth/parameters/0'
    - $ref: '#/paths/~1pools~1%7Buid%7D/parameters/1'
    put:
      tags:
      - Transfers
      summary: Cancel a Transfer
      description: 'Transfers must be canceled by the originating Customer (or Authorized Representative).


        Transfers can only enter the canceled state if Newline receives a request while the Transfer is in `queued` or `pending states`.


        A cancellation request during the `pending` state is not guaranteed, as this state may include payment execution. At that stage, a cancel request will result in an error.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorized_representative_name:
                  type: string
                  description: 'Name of the authorized representative who wants to cancel the transfer. Max 35 characters.

                    '
                  maxLength: 35
                  example: Swee'Pea
                cancellation_reason:
                  type: string
                  description: 'Reason for cancellation. Max 135 characters.

                    '
                  maxLength: 135
                  example: Transfer submitted by accident
      responses:
        '200':
          description: The updated Transfer resource is returned
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1transfers/post/responses/201/content/application~1json/schema'
              examples:
                canceled_transfer:
                  $ref: '#/paths/~1transfers~1%7Buid%7D/get/responses/200/content/application~1json/examples/canceled_transfer'
        '400':
          description: The transfer is not eligible for cancellation
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1returns/get/responses/403/content/application~1json/schema'
              examples:
                invalid_transfer_cancellation:
                  value:
                    errors:
                    - code: 3025
                      title: Transfer cannot be canceled
                      detail: Newline cannot cancel the transfer submitted. Please verify the transfer UIDs, the type of transfer (wire or ACH), and the status of the transfer being canceled.
                      occurred_at: '2024-03-06T14:53:45.084Z'
                      extra: 'Transfer status must be one of the following to cancel: pending, queued'
                    status: 400
        '422':
          description: The transfer could not be canceled
          headers:
            x-trace-id:
              $ref: '#/paths/~1auth/post/responses/201/headers/x-trace-id'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1returns/get/responses/403/content/application~1json/schema'
              examples:
                transfer_cancellation_error:
                  value:
                    errors:
                    - code: 3026
                      title: Could not cancel transfer
                      detail: An exception occurred while canceling the transfer
                      occurred_at: '2024-03-06T14:15:55.723Z'
                      extra: The payment has already been submitted. It is too late to cancel.
                    status: 422
