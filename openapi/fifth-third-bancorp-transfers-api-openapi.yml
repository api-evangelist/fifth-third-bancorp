                  $ref: '#/paths/~1transfers/post/responses/201/content/application~1json/examples/ach_transfer'
                instant_payment_transfer:
                  $ref: '#/paths/~1transfers/post/responses/201/content/application~1json/examples/instant_payment_transfer'
                wire_transfer:
                  $ref: '#/paths/~1transfers/post/responses/201/content/application~1json/examples/wire_transfer'
