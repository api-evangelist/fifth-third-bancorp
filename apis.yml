    \ GET /products/{uid}](https://developers.newline53.com/reference/get_products-uid)\n\nThe Products\
    \ endpoint represents the financial products available to your Customers. It exposes the accounts,\
    \ compliance, and Customer Profile Requirements necessary for your Customer to access the Product.\
    \ For some programs, a customer must onboard one product before another product is made available.\
    \ Newline will work with clients to define the required Product onboarding sequence as part of your\
    \ Program.\n\nUse the Products endpoint to view the Products available to your Program and the prerequisite\
    \ information or actions that must be taken for a Customer to access the Product.\n\nFor more information\
    \ about Newline's products and their utilization, please refer to the [Products Programs](https://developers.newline53.com/docs/product-programs)\
