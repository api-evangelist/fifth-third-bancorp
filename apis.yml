- aid: fifth-third-bancorp:fifth-third-bancorp-auth-api
  name: Fifth Third Bancorp Auth API
  description: "The Authentication section explains how to securely interact with Newline's API using\
    \ access tokens and static IP addresses. Learn how to generate and refresh tokens to access protected\
    \ resources.  \n\n**Endpoints:**\n\n- POST [Generate an authentication token: POST /auth](https://developers.newline53.com/reference/post_auth)\n\
    \nNewline requires access tokens and static IP addresses for authentication and authorization when\
    \ requesting any resource endpoints. [POST /auth](https://developers.newline53.com/reference/post_auth)\
    \ is used to obtain and refresh the required access tokens. Please work with your Relationship Team\
    \ or the Newline Team in all environments to set up the IP Allowlist for your Program.  \nTo obtain\
    \ an access token, you must submit a refresh token. After a program is set up, Newline will share\
    \ your Program UID and HMAC key offline. These values are required for the refresh token and access\
    \ token requests.\n\n## Auth Flow\n\nThe authentication flow is as follows:\n\n1. Create a JWT using\
    \ the following claim:\n```\n{\n  \"iat\": <current Epoch time>,\n  \"sub\": <Program UID>\n}\n ```\n\
    \n1. Sign the JWT to create a JWS with the shared key using HS512 / SHA-512.\n\n2. Exchange for an\
    \ access token by sending a request to [POST /auth](https://developers.newline53.com/reference/post_auth),\
    \ using the JWS in the `Authorization` header.\n\n3. Access resources through other endpoints using\
    \ the returned token in the `Authorization` header for up to 8 hours.\n\n4. Repeat the process as\
    \ needed to continue authenticating successfully.\n\n> **Note** \n> If a new access token is requested\
    \ within the 8 hours of a previous token being successfully exchanged, the new token will still be\
    \ generated. This does not expire the last token, and both tokens are usable simultaneously until\
    \ their respective time is up. However, it is encouraged to use the new token and discard the old\
    \ one if possible, as this behavior may change in the future."
  humanURL: https://developers.newline53.com/reference/auth
