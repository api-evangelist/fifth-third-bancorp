    The returns endpoint allows for the retrieval and creation of return transactions within the system.


    [GET List Returns](https://newline-enterprise-group.readme.io/reference/get_returns)- Use this endpoint
    to retrieve a list of all return transactions. You can filter the results based on various parameters
    such as status or date.


    [POST Create a New Return](https://newline-enterprise-group.readme.io/reference/post_returns)- This
    endpoint is used to Create a new return transaction. Return can only be created for eligible transactions
    that have already been completed.


    [GET a Single Return](https://newline-enterprise-group.readme.io/reference/get_returns-uid)- Use this
    endpoint to retrieve details about a specific return transaction.
