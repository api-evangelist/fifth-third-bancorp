- aid: fifth-third-bancorp:fifth-third-bancorp-custodial-accounts-api
  name: Fifth Third Bancorp Custodial Accounts API
  description: "Fifth Third Bank holds Custodial Accounts and represents funds managed for Customers.\
    \ Through these endpoints, you can manage balances and track account statuses.\n\n**Endpoints:**\n\
    \n- GET [List Custodial Accounts: GET /custodial_accounts](https://developers.newline53.com/reference/get_custodial-accounts)\n\
    \    \n- GET [Get a single Custodial Account: GET /custodial_accounts/{uid}](https://developers.newline53.com/reference/get_custodial-accounts-uid)\n\
    \nA Custodial Account is the account held by Fifth Third Bank. Custodial Accounts in a Program can\
    \ only be created for the Service Offerings that have been configured for that Program.\n\nA Customer\
    \ must successfully complete onboarding and pass all KYC/AML checks before their Custodial Accounts\
    \ can be opened. This endpoint can be used to retrieve the accounts (active and archived) and their\
    \ balances for your Customers. All funds must be emptied from a Custodial Account before it can be\
    \ archived."
