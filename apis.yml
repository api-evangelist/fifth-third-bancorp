- aid: fifth-third-bancorp:fifth-third-bancorp-pools-api
  name: Fifth Third Bancorp Pools API
  description: "Pools group multiple Customers for asset sharing and distributed account ownership. Each\
    \ Pool is unique to a Customer or program.\n\n**Endpoints:**\n\n- GET [List Pools: GET /pools](https://developers.newline53.com/reference/get_pools)\n\
    \    \n- GET [Get a single Pool: GET /pools/{uid}](https://developers.newline53.com/reference/get_pools-uid)\n\
    \nA pool is a construct that Newline uses to associate multiple customers with each other. A Pool\
    \ is always associated with at least one Customer, but all accounts are only ever associated with\
    \ a single Pool. This enables asset sharing and distributed ownership of accounts across multiple\
    \ Customers.\n\nNewline currently supports single Customer Pools, where **one Customer is associated\
    \ with one Pool and vice versa**. All accounts, transfers, and transactions are related to the Customer's\
    \ Pool, not the Customer. The Pool UID appears on several endpoint responses and may be required by\
    \ the API in some instances."
