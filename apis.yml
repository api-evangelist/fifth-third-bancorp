- aid: fifth-third-bancorp:fifth-third-bancorp-combined-transfers-api
  name: Fifth Third Bancorp Combined Transfers API
  description: "The Combined Transfers endpoint allows clients to create both a transfer and a counterparty\
    \ in a single API call. This simplifies the process by eliminating the need to first create an external\
    \ synthetic account and then reference it when initiating a transfer.\n\n## Endpoints:\n\n- GET List\
    \ Combined Transfers: [GET /combined_transfers](https://developers.newline53.com/reference/get_combined-transfers)\n\
    - POST Create a Combined Transfer: [POST/combined_transfers](https://developers.newline53.com/reference/post_combined-transfers)\n\
    - GET Get a Single Combined Transfer: [GET /combined_transfers/{uid}](https://developers.newline53.com/reference/get_combined-transfers-uid)\n\
    \nTransfers facilitate the movement of assets between accounts, enabling transactions such as payments\
    \ and withdrawals. Combined Transfers work by creating both a synthetic account and a transfer in\
    \ one API call, streamlining the process and reducing the steps required for asset movement.\n\nThe\
    \ types and distribution of assets, the number of customers, and other rules governing the usage of\
    \ Combined Transfers can be configured for each account on a program-by-program basis. This includes\
    \ setting up the synthetic account types and defining the rules for asset movement between accounts.\n\
    \n## Combined Transfers Statuses:\n\n**Queued:** The combined transfer request has been received and\
    \ is waiting to be processed.  \n**Pending:** The combined transfer is currently being processed.\
    \  \n**Failed:** The combined transfer could not be completed due to an error.  \n**Completed:** The\
    \ combined transfer has been successfully completed."
  humanURL: https://developers.newline53.com/reference/auth
  baseURL: https://sandbox.newline53.com/api/v1
