- aid: fifth-third-bancorp:fifth-third-bancorp-customers-api
  name: Fifth Third Bancorp Customers API
  description: "The Customers section provides details on managing end-user accounts. Learn how to create,\
    \ update, and archive customer records and onboard them to financial products while meeting KYC/AML\
    \ requirements.\n\n**Endpoints:**\n\n- GET [List Customers: GET /customers](https://developers.newline53.com/reference/get_customers)\n\
    \    \n- POST [Create a new Customer: POST /customers](https://developers.newline53.com/reference/post_customers)\n\
    \    \n- GET [Get a single Customer: GET /customers/{uid}](https://developers.newline53.com/reference/get_customers-uid)\n\
    \    \n- PUT [Adjust Customer Data: PUT /customers/{uid}](https://developers.newline53.com/reference/put_customers-uid)\n\
    \    \n- DELETE [Archive a Customer: DELETE /customers/{uid}](https://developers.newline53.com/reference/delete_customers-uid)\n\
    \    \nA Customer on the Newline Platform is the end user of your application. Customers are unique\
    \ to each Program, and managing all accounts and identifying information is handled on a Program-by-Program\
    \ basis.  \nThe ability to create new Customers is also a preset condition of your Program at Newline.\
    \ Please see the below sections for more details.\n\n## Newline preset-Customers\n\nIn cases where\
    \ the Client also serves as the Customer (i.e., the Client is both the end-user and the managing entity\
    \ over any financial products), Newline will create Customers upon Program onboarding. Clients will\
    \ also be precluded from creating new Customers.\n\n## Client-initiated Customers\n\n**Customer Onboarding\
    \ Process for Clients**  \nWhen managing customer onboarding, follow the outlined steps and key considerations\
    \ below.\n\n### Steps for Onboarding Customers:\n\n1. Initial Submission:\n\n    1. Submit the external_uid\
    \ and email using the Customers Endpoint.\n\n2. Provide Personally Identifiable Information (PII):\n\
    \n    1. After the initial submission, supply the remaining PII for the customer.\n\n    2. Ensure\
    \ that all required PII fields are complete. Requests with complete or missing fields will be accepted.\n\
    \n3. Edit PII (Optional):\n\n    1. PII can be updated until a valid request is sent to onboard the\
    \ customer to a product using the Customer Product Endpoint.\n\n4. Submit Profile Responses:\n\n \
    \   1. Provide profile responses to meet the product's profile requirements.\n\n    2. Profile Requirements\
    \ can include data such as:\n\n        1. Risk tolerance\n\n        2. Income level\n\n        3.\
    \ Other product-specific information\n\n5. Verify Profile Requirements:\n\n    1. Use the Product\
    \ Endpoint to access the Profile Requirements and ensure the customer satisfies all prerequisites\
    \ for onboarding.\n\n6. Initiate Onboarding Request:\n\n    1. Submit a valid onboarding request for\
    \ the customer using the Customer Products Endpoint.\n\n## Additional Considerations:\n\nKYC/AML Verification:\n\
    \n- To join a program, customers must pass Know Your Customer (KYC) and Anti-Money Laundering (AML)\
    \ identity verification as required by Fifth Third Bank.\n\n- KYC_status on the customer record will\
    \ indicate the current state of the KYC/AML workflow.\n\nOnce a valid onboarding request is received,\
    \ Newline initiates KYC/AML verification using the customer's PII.  \n**Verification statuses include:**\n\
    \n- Approved\n\n- Manual Review\n\n- Documents Required\n\n- Denied\n\nNewline will work with clients\
    \ to define these states.\n\n## Program-Specific Records:\n\n- A new customer record must be created\
    \ for each program, even if an identical customer exists in another program.\n\n- Customer records\
    \ are not accessible outside of their associated program.\n\n## Customer Management Functions:\n\n\
    The Customers Endpoint can also be used to perform management actions such as:\n\n- Freezing or unfreezing\
    \ a customer\n\n- Archiving a customer"
