- aid: fifth-third-bancorp:fifth-third-bancorp-transactions-api
  name: Fifth Third Bancorp Transactions API
  description: "Transactions represent asset movements, such as ACH payments, wire transfers, or card\
    \ purchases. Track transaction statuses and events through these endpoints.  \n**Endpoints:**\n\n\
    - GET [List Transactions: GET /transactions](https://developers.newline53.com/reference/get_transactions)\n\
    \n- GET [Get a single Transaction: GET /transactions/{uid}](https://developers.newline53.com/reference/get_transactions-uid)\n\
    \n- PUT [Approve or deny a Transaction: PUT /transactions/{uid}/authorize](https://developers.newline53.com/reference/put_transactions-uid-authorize)\n\
    \n- GET [List Transaction Events: GET /transaction_events](https://developers.newline53.com/reference/get_transaction-events)\n\
    \n- GET [Get a single Transaction Event: GET /transaction_events/{uid}](https://developers.newline53.com/reference/get_transaction-events-uid)\n\
    \n- GET [List Synthetic Line Items: GET /synthetic_line_items](https://developers.newline53.com/reference/get_synthetic-line-items)\n\
    \n- GET [Get a single Synthetic Line Item: GET /synthetic_line_items/{uid}](https://developers.newline53.com/reference/get_synthetic-line-items-uid)\n\
    \n- GET [List Custodial Line Items: GET /custodial_line_items](https://developers.newline53.com/reference/get_custodial-line-items)\n\
    \n- GET [Get a single Custodial Line Item: GET /custodial_line_items/{uid}](https://developers.newline53.com/reference/get_custodial-line-items-uid)\n\
    \nTransactions are created based on how you instruct Newline to move assets (a Transfer) or how assets\
    \ are moved or spent outside your application (ATM withdrawals, debit card purchases, wire transfers,\
    \ etc…). The Transaction contains the amount, origin, and destination of assets. Newline categorizes\
    \ Transactions into types to assist in their classification and representation.\n\nTransactions fall\
    \ into many categories, including debit card purchases, direct deposits, interest, and fees. This\
    \ endpoint can retrieve a list of Transactions or track the status of an ongoing Transaction.\n\n\
    Transaction Events are created as a result of a Transaction. They capture the steps required to complete\
    \ the Transaction. These can be used to view the progress of an in-flight Transaction or see the history\
    \ of a completed Transaction.\n\nLine Items are created for each Transaction Event. They catalog the\
    \ individual credits and debits associated with the accounts involved in the Transaction."
  humanURL: https://developers.newline53.com/reference/auth
  baseURL: https://sandbox.newline53.com/api/v1
