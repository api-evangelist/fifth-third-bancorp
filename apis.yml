- aid: fifth-third-bancorp:fifth-third-bancorp-virtual-reference-numbers-api
  name: Fifth Third Bancorp Virtual Reference Numbers API
  description: "VRNs act as aliases for accounts, enabling unique use cases like accounts receivable segmentation\
    \ or reconciliation.  \n\n**Endpoints:**\n\n- GET [List Virtual Reference Numbers: GET /virtual_reference_numbers](https://developers.newline53.com/reference/get_virtual-reference-numbers)\n\
    \n- POST [Create a new Virtual Reference Number: POST /virtual_reference_numbers](https://developers.newline53.com/reference/post_virtual-reference-numbers)\n\
    \n- GET [Get a single Virtual Reference Number: GET /virtual_reference_numbers/{uid}](https://developers.newline53.com/reference/get_virtual-reference-numbers-uid)\n\
    \n- PUT [Edit a Virtual Reference Number: PUT /virtual_reference_numbers/{uid}](https://developers.newline53.com/reference/put_virtual-reference-numbers-uid)\n\
    \n- DELETE [Archive a Virtual Reference Number: DELETE /virtual_reference_numbers/{uid}](https://developers.newline53.com/reference/delete_virtual-reference-numbers-uid)\n\
    \n- PUT [Lock a Virtual Reference Number: PUT /virtual_reference_numbers/{uid}/lock](https://developers.newline53.com/reference/put_virtual-reference-numbers-uid-lock)\n\
    \n- PUT [Unlock a Virtual Reference Number: PUT /virtual_reference_numbers/{uid}/unlock](https://developers.newline53.com/reference/put_virtual-reference-numbers-uid-unlock)\n\
    \nVirtual Reference Numbers (or VRNs) are virtualized account numbers that point to a single deposit\
    \ account. They are aliases to a Synthetic Account and can form a many-to-one relationship with their\
    \ parent Synthetic Account.\n\n**Common VRNs Use Cases:**\n\n- This is to reference a stored funds\
    \ product that is client-managed on a separate ledger. Clients can then provide VRNs to external merchants\
    \ or counterparties who wish to pay for that stored fund's product.\n\n- This provides Clients with\
    \ another layer of network-addressable account numbers with which to accept payments. This many-to-one\
    \ relationship affords Clients account segmentation. For instance, one VRN is utilized for Accounts\
    \ Receivable (AR) while the other is used for Accounts Payable (AP), all while referencing the same\
    \ underlying Account.\n\nThese same VRNs can then be aligned with Custodial Accounts transactions\
    \ to allow for quick reconciliation or accounting.\n\n> **Note**\n> For certain payment rails, like\
    \ Instant Payments, VRNs must be registered with Newline and Fifth Third before being used, as this\
    \ will allow for network acceptance. Please review the fields in each API reference to confirm Instant\
    \ Payment registration."
