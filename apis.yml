- aid: fifth-third-bancorp:fifth-third-bancorp-products-api
  name: Fifth Third Bancorp Products API
  description: "Products represent financial services available in your program. Discover onboarding requirements,\
    \ prerequisites, and detailed product configurations.\n\n**Endpoints:**\n\n- GET [List Products: GET\
