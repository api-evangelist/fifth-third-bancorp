- aid: fifth-third-bancorp:fifth-third-bancorp-transfers-api
  name: Fifth Third Bancorp Transfers API
  description: "Transfers facilitate the movement of assets between accounts, enabling transactions such\
    \ as payments and withdrawals.\n\n**Endpoints:**\n\n- GET [List Transfers: GET /transfers](https://developers.newline53.com/reference/get_transfers)\n\
    \n- POST [Initiate a Transfer: POST /transfers](https://developers.newline53.com/reference/post_transfers)\n\
    \n- GET [Get a single Transfer: GET /transfers/{uid}](https://developers.newline53.com/reference/get_transfers-uid)\n\
    \n- PUT [Cancel a Transfer: PUT /transfers/{uid}/cancel](https://developers.newline53.com/reference/put_transfers-uid-cancel)\n\
    \nA Transfer is the Action of moving assets between two Synthetic Accounts. Most asset movement initiated\
    \ by your application will result in a Transfer. Asset movement is determined by the makeup of assets\
    \ in both participating accounts, the Synthetic Account Type of the participating accounts, the available\
    \ Custodial Accounts for all participating Customers, and the overall Program configuration. A Transfer\
    \ can never be initiated between two external accounts.\n\n### Company ID Behavior\n\nThe company_id\
    \ field is optional when initiating a transfer. However, it becomes required if your organization\
    \ has multiple company IDs or multiple custodial accounts, to ensure accurate routing of funds. If\
    \ provided, the value will be validated.\n\nIn sandbox environments:\n\n- `company_id` is optional\
    \ and will be validated if supplied.\n- `company_id` and custodial accounts are always in a 1:1 relationship.\n\
    \n> **Note** \n> Any time a Transfer is created, it creates 1+ Transactions, which are returned in\
    \ the response payload for a successful Transfer. Please note or record these uids, as they will be\
    \ needed to query the Transaction object and any associated key data points. For instance, Fed IMAD\
    \ or CHIPS SSN is used for outgoing wires."
