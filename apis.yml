- aid: fifth-third-bancorp:fifth-third-bancorp-customer-products-api
  name: Fifth Third Bancorp Customer Products API
  description: "Customer Products link Customers to financial products. This section outlines how to onboard\
    \ customers, manage their product relationships, and track statuses.\n\n**Endpoints:**\n\n- GET [List\
    \ Customer Products: GET /customer_products](https://developers.newline53.com/reference/get_customer-products)\n\
    \    \n- POST [Onboard a Customer onto a Product: POST /customer_products](https://developers.newline53.com/reference/post_customer-products)\n\
    \    \n- GET [Get a single Customer Product: GET /customer_products/{uid}](https://developers.newline53.com/reference/get_customer-products-uid)\n\
    \nCustomer Product records are generated when a Customer is submitted for onboarding to a specific\
    \ Product.\n\n## Newline preset-Customers\n\nIf the Client is also the Customer, the Customer Product\
    \ record will be autogenerated during the Client's onboarding to our production environment.\n\n##\
    \ Client-initiated Customers\n\nWhen clients onboard a Customer, the Customer must fulfill the prerequisite\
    \ Product requirements. Newline will then verify that the Product requirements have been met.\n\n\
    If the Product requirements are met, Newline will proceed with account opening and feature enablement\
    \ as specified by the Product. If the product requirements are unmet, Newline will return an error\
    \ response indicating which element of the product validation failed."
